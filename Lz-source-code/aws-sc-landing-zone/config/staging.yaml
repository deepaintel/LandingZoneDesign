# ---------------------------------------------------------------------------------------------
# Staging AWS Organization - ACTIVE deployment configuration for the OU implementation phase.
#
# Deployment source: protected release/* branch only (staging-deploy.yml).
#
# Loading: this file is loaded via @ccoe-aws_if-it/ccoe-config-reader used as a generic YAML
# loader library by ConfigReader with LandingZoneSchema.
#
# The AWS Organizations Root is NEVER created by CDK application code. Its lifecycle is handled
# by the prepare-organization composite action (.github/actions/prepare-organization) at deploy
# time: idempotent detect-or-create, Root ID emitted as a step output and fed to `cdk deploy`
# via the OrganizationRootId CloudFormation parameter. No Root ID is stored in this file or
# anywhere else in source control.
#
# aws.accountId is the AWS Organizations management account ID (a 12-digit identifier, not a
# credential). It may live here under the compensating controls documented in CLAUDE.md §14.
# No access keys, secret access keys, IAM user credentials, bearer tokens, or role ARNs are
# stored in this file.
# ---------------------------------------------------------------------------------------------
aws:
  # Staging AWS Organizations management account (aws-cloud-org-002).
  accountId: '118669550429'

identityCenter:
  instanceName: aws-esc-landing-zone-staging
  scim:
    checkForScimSync: 172800 # 48 hours
  scimCleanup:
    checkForScimCleanup: 172800 # 48 hours

# Shared-account per-environment overrides. Names / OU / owner / costCentre / operationsContact
# come from config/default.yaml. Only email and securityContact differ between environments; both
# are declared here so a merge conflict inside default.yaml can never silently supply the wrong
# staging email. Emails are unique AWS account identifiers - CreateAccount rejects duplicates.
accounts:
  logArchive:
    email: 'FMITaws-cloud-org-002+LogArchive@if.se'
    securityContact: 'FMITaws-cloud-org-002+SecurityContact@if.se'
  audit:
    email: 'FMITaws-cloud-org-002+Audit@if.se'
    securityContact: 'FMITaws-cloud-org-002+SecurityContact@if.se'

# ---------------------------------------------------------------------------------------------
# Landing Zone platform + CCoE validation accounts for Staging.
#
# Governed by `.apm/instructions/landing-zone-account-provisioning.instructions.md` and
# `.apm/skills/generate-account/SKILL.md`. Loaded by `LandingZoneAccountsStack` via
# `@ccoe-aws_if-it/ccoe-config-reader` + the `landingZoneAccountsSchema` block of
# `LandingZoneSchema`.
#
# Active accounts (9): SecurityTooling, SharedServices, Network, and all six CCoE-* validation
# accounts. IF has confirmed the CCoE-Hybrid-NonProd-01 email as
# `FMITaws-cloud-org-002+CCoE-Hybrid-NonProd-01@if.se`; the earlier email discrepancy is closed.
#
# ALL entries in this block are provisioned only in the Staging AWS Organization. The P1
# `environment` value is an account/tag classification and does not select the AWS Organization.
# Customer-confirmed values are explicit per account: platform accounts and Workloads/*/Prod use
# `environment: prod`; Workloads/*/Non-Prod use `environment: staging`; all nine accounts use
# `lifecycle: active` and `dataClassification: internal`.
#
# Authoritative mappings (see §6.1 and §9):
#   Owner / Team  -> owner
#   Account Email -> owner-email
#   Cost Centre   -> itsystemcode
# `owner`, `owner-email`, and `itsystemcode` are derived at synth time from the fields below;
# they are NOT separate configuration inputs. `data-residency` is fixed to `EU`. `domain` is the
# customer-confirmed literal `Cloud Application Platform` for every current LZ account per §8.1
# and is sourced from configuration (never hard-coded in TypeScript / CDK).
# ---------------------------------------------------------------------------------------------
landingZoneAccounts:
  securityTooling:
    name: 'SecurityTooling'
    email: 'FMITaws-cloud-org-002+SecurityTooling@if.se'
    ouPath: 'Security'
    owner: 'CCoE'
    costCentre: 'AISARCH'
    securityContact: 'FMITaws-cloud-org-002+SecurityContact@if.se'
    operationsContact: 'cloud@if.eu'
