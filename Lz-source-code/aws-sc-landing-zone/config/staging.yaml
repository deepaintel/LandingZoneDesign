# ---------------------------------------------------------------------------------------------
# Control Tower Landing Zone 4.0 - Staging retention overrides.
#
# Overrides the shared baseline in config/default.yaml. Retention is set explicitly on BOTH
# integrations (centralizedLogging AND config) because LZ 4.0 uses dedicated resources for
# CloudTrail-centered centralized logging and for AWS Config. Retention on one does not imply
# retention on the other.
#
# `kmsKeyArn` is DELIBERATELY OMITTED from both `centralizedLogging.configurations` and
# `config.configurations`. AWS Control Tower applies its standard/default encryption
# configuration when omitted.
#
# Staging retention values:
#   centralizedLogging.configurations.loggingBucket.retentionDays        : 180
#   centralizedLogging.configurations.accessLoggingBucket.retentionDays  : 180
#   config.configurations.loggingBucket.retentionDays                    : 180
#   config.configurations.accessLoggingBucket.retentionDays              : 180
# ---------------------------------------------------------------------------------------------
controlTower:
  centralizedLogging:
    configurations:
      loggingBucket:
        retentionDays: 180
      accessLoggingBucket:
        retentionDays: 180
  config:
    configurations:
      loggingBucket:
        retentionDays: 180
      accessLoggingBucket:
        retentionDays: 180
