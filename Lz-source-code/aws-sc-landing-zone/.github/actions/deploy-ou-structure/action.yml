name: deploy-ou-structure
description: >
  Deploy the AWS Organizations OU Structure stack (`lz-ou-structure`) and run the post-deployment
  OU validation (14 OUs, valid OU-ID pattern, five approved top-level OUs present under the
  resolved Root, only `AWS::Organizations::OrganizationalUnit` resources in the stack).
  Reused by staging-deploy.yml and production-deploy.yml per
  `.apm/instructions/landing-zone-ou-governance.instructions.md` §22.6.
  Requires AWS credentials to be configured before this action runs (typically via the reusable
  `aws-credentials` composite action) and the AWS Organization to already exist in the target
  account (see the prepare-organization composite action).
inputs:
  environment:
    description: Target environment (`staging` or `production`). Passed to `cdk` via `-c environment=...`.
    required: true
  account-id:
    description: 12-digit AWS account ID the CDK stacks deploy into. Sets `CDK_DEFAULT_ACCOUNT`.
    required: true
  organization-root-id:
    description: >
      Organizations Root ID resolved at deploy time by the `prepare-organization` composite action.
      Passed to `cdk deploy` via `--parameters OrganizationRootId=<id>`.
    required: true
  aws-region:
    description: AWS region for CloudFormation and Organizations API calls.
    required: false
    default: eusc-de-east-1
  stack-id:
    description: CDK construct ID of the OU Structure stack.
    required: false
    default: OuStructureStack
  ou-stack-name:
    description: CloudFormation stack name of the OU Structure stack.
    required: false
    default: lz-ou-structure
  diff-continue-on-error:
    description: >
      When `'true'`, a non-zero `cdk diff` exit code does not fail the step. Preserves the
      pre-refactor behavior where Staging's diff was advisory (`continue-on-error: true`) and
      Production's diff was strict.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: CDK diff (OU Structure stack)
      shell: bash
      env:
        CDK_DEFAULT_ACCOUNT: ${{ inputs.account-id }}
        CDK_DEFAULT_REGION: ${{ inputs.aws-region }}
        ENVIRONMENT_NAME: ${{ inputs.environment }}
        STACK_ID: ${{ inputs.stack-id }}
        ORGANIZATION_ROOT_ID: ${{ inputs.organization-root-id }}
        DIFF_CONTINUE_ON_ERROR: ${{ inputs.diff-continue-on-error }}
      run: |
        set +e
        pnpm exec cdk diff "${STACK_ID}" \
          -c environment="${ENVIRONMENT_NAME}" \
          --parameters "OrganizationRootId=${ORGANIZATION_ROOT_ID}"
        rc=$?
        if [ "${DIFF_CONTINUE_ON_ERROR}" = "true" ] && [ "${rc}" -ne 0 ]; then
          echo "::warning::cdk diff for ${STACK_ID} exited with ${rc}; continuing because diff-continue-on-error=true (advisory)."
          exit 0
        fi
        exit "${rc}"

    - name: Deploy OU Structure stack
      shell: bash
      env:
        CDK_DEFAULT_ACCOUNT: ${{ inputs.account-id }}
        CDK_DEFAULT_REGION: ${{ inputs.aws-region }}
        ENVIRONMENT_NAME: ${{ inputs.environment }}
        STACK_ID: ${{ inputs.stack-id }}
        ORGANIZATION_ROOT_ID: ${{ inputs.organization-root-id }}
      run: |
        pnpm exec cdk deploy "${STACK_ID}" \
          -c environment="${ENVIRONMENT_NAME}" \
          --parameters "OrganizationRootId=${ORGANIZATION_ROOT_ID}" \
          --require-approval never \
          --progress events

    - name: Post-deployment OU validation
      shell: bash
      env:
        ESC_REGION: ${{ inputs.aws-region }}
        ORGANIZATION_ROOT_ID: ${{ inputs.organization-root-id }}
        OU_STACK_NAME: ${{ inputs.ou-stack-name }}
      run: |
        set -euo pipefail

        STACK_NAME=$(jq -r --arg name "${OU_STACK_NAME}" '
          [
            .artifacts | to_entries[]
            | select(.value.type == "aws:cloudformation:stack")
            | select(.value.properties.stackName == $name)
            | .value.properties.stackName
          ]
          | if length == 1 then .[0] else empty end
        ' cdk.out/manifest.json)

        if [ -z "${STACK_NAME}" ] || [ "${STACK_NAME}" = "null" ]; then
          echo "::error::Expected exactly one ${OU_STACK_NAME} artifact in cdk.out/manifest.json."
          exit 1
        fi
        echo "Validating stack: ${STACK_NAME}"

        STATUS=$(aws cloudformation describe-stacks \
          --stack-name "${STACK_NAME}" \
          --region "${ESC_REGION}" \
          --query 'Stacks[0].StackStatus' --output text)
        echo "Stack status: ${STATUS}"

        case "${STATUS}" in
          CREATE_COMPLETE|UPDATE_COMPLETE) ;;
          *) echo "::error::Unexpected stack status '${STATUS}'."; exit 1 ;;
        esac

        # 1. Every OU reported by the stack must exist and carry a real OU ID.
        mapfile -t OU_IDS < <(aws cloudformation describe-stacks \
          --stack-name "${STACK_NAME}" \
          --region "${ESC_REGION}" \
          --query "Stacks[0].Outputs[?starts_with(OutputKey, 'OuId')].OutputValue" \
          --output text | tr '\t' '\n' | sed '/^$/d')

        echo "Reported organizational units: ${#OU_IDS[@]}"
        if [ "${#OU_IDS[@]}" -ne 14 ]; then
          echo "::error::Expected 14 organizational units but the stack reported ${#OU_IDS[@]}."
          exit 1
        fi

        for id in "${OU_IDS[@]}"; do
          if ! printf '%s' "$id" | grep -qE '^ou-[0-9a-z]{4,32}-[0-9a-z]{8,32}$'; then
            echo "::error::'$id' is not a valid AWS Organizations OU ID."
            exit 1
          fi
        done

        # 2. The five approved top-level OUs must be present under the Root resolved at deploy time.
        ROOT_CHILDREN=$(aws organizations list-organizational-units-for-parent \
          --parent-id "${ORGANIZATION_ROOT_ID}" \
          --region "${ESC_REGION}" \
          --query 'OrganizationalUnits[].Name' --output text | tr '\t' '\n')
        echo "OUs directly below Root:"
        echo "${ROOT_CHILDREN}" | sed 's/^/  - /'

        for expected in Security Infrastructure Sandbox Suspended Workloads; do
          if ! printf '%s\n' "${ROOT_CHILDREN}" | grep -qx "${expected}"; then
            echo "::error::Approved top-level OU '${expected}' was not found under the Organizations Root."
            exit 1
          fi
        done

        # 3. The OU stack contains only organizational-unit resources - no accounts, no policies.
        if aws cloudformation describe-stack-resources \
             --stack-name "${STACK_NAME}" --region "${ESC_REGION}" \
             --query 'StackResources[].ResourceType' --output text \
             | tr '\t' '\n' | grep -vx 'AWS::Organizations::OrganizationalUnit' | grep -q .; then
          echo "::error::The deployed OU stack contains resources other than organizational units."
          exit 1
        fi

        echo "Post-deployment OU validation passed."
