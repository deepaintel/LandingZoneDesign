name: reconcile-account-baseline
description: >
  Common Account Security Baseline v1.0 (enable only) for every eligible Landing Zone account of the
  environment: S3 account-level Block Public Access, EBS encryption by default (default KMS key
  preserved), EC2 IMDSv2 account defaults, EBS snapshot Block Public Access and AMI Block Public
  Access. Runs a read-only environment-wide preflight gate (inventory, eligibility, Control Tower
  health, member sessions, CLI capabilities, every control, DryRun authorization) that must pass
  before any write; then up to three apply rounds that each repeat the gate from live state and make
  only the planned enable-only writes, account by account, with a pre-write recheck and bounded
  settle polling; then a read-only verification that evaluates the acceptance gate, writes the job
  summary and uploads account-baseline-report.json. Any failure stops further changes and fails the
  job, so the Production job never starts after a failed Staging run.
  Governed by `.apm/skills/common-account-baseline/SKILL.md`. Supported environments are `staging` and
  `production`; the first step refuses any other environment before an AWS API call is made.
  github-actions-role sessions last one hour, so every phase refreshes OIDC credentials through the
  approved reusable aws-credentials action. Member accounts are reached only through the established
  OrganizationAccountAccessRole; no IAM role, Lambda function or StackSet is created anywhere.
inputs:
  environment:
    description: Target environment, `staging` or `production`.
    required: true
  management-account-id:
    description: 12-digit AWS Organizations management account ID (workspace output).
    required: true
  organization-id:
    description: AWS Organizations organization ID (prepare-organization output).
    required: true
  landing-zone-arn:
    description: Control Tower Landing Zone ARN (initialize-control-tower output).
    required: true
  audit-account-id:
    description: Audit account ID (deploy-shared-accounts output); excluded from enforcement.
    required: true
  log-archive-account-id:
    description: Log Archive account ID (deploy-shared-accounts output); excluded from enforcement.
    required: true
  account-ids:
    description: Newline-delimited `<key>=<12-digit account id>` pairs (deploy-landing-zone-accounts output).
    required: true
  ou-ids:
    description: Newline-delimited `<ou path>=<ou id>` pairs (deploy-landing-zone-accounts output).
    required: true
  aws-region:
    description: AWS ESC home Region.
    required: false
    default: eusc-de-east-1
  aws-partition:
    description: Partition value for the reusable aws-credentials action.
    required: false
    default: eusc
  deployment-role-name:
    description: OIDC deployment role assumed for every phase.
    required: false
    default: github-actions-role
  job-started-at:
    description: Job start time in epoch seconds, recorded by the first step of the calling job.
    required: true
  job-timeout-minutes:
    description: The calling job's timeout-minutes.
    required: false
    default: '360'
  session-budget-seconds:
    description: Seconds of work per round; must stay below the one-hour credential lifetime.
    required: false
    default: '3000'
outputs:
  acceptance:
    description: Environment-level acceptance of the post-deployment validation, `PASS` or `FAIL`.
    value: ${{ steps.verify.outputs.acceptance }}
  results:
    description: Actual/expected account-control results of the post-deployment validation, for example `40/40`.
    value: ${{ steps.verify.outputs.results }}
runs:
  using: composite
  steps:
    - name: Refuse unsupported environments (staging and production only)
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        case "${ENVIRONMENT_NAME}" in
          staging|production) echo "Environment='${ENVIRONMENT_NAME}' - Common Account Security Baseline authorised." ;;
          *)
            echo "::error::The account baseline supports only staging and production; refusing environment '${ENVIRONMENT_NAME}'."
            exit 1 ;;
        esac

    - name: Validate account baseline inputs
      id: inputs
      shell: bash
      env:
        MANAGEMENT_ACCOUNT_ID: ${{ inputs.management-account-id }}
        ORGANIZATION_ID: ${{ inputs.organization-id }}
        LANDING_ZONE_ARN: ${{ inputs.landing-zone-arn }}
        AUDIT_ACCOUNT_ID: ${{ inputs.audit-account-id }}
        LOG_ARCHIVE_ACCOUNT_ID: ${{ inputs.log-archive-account-id }}
        ACCOUNT_IDS: ${{ inputs.account-ids }}
        OU_IDS: ${{ inputs.ou-ids }}
        JOB_STARTED_AT: ${{ inputs.job-started-at }}
        JOB_TIMEOUT_MINUTES: ${{ inputs.job-timeout-minutes }}
        SESSION_BUDGET_SECONDS: ${{ inputs.session-budget-seconds }}
      run: |
        set -euo pipefail
        for pair in "management-account-id=${MANAGEMENT_ACCOUNT_ID}" "audit-account-id=${AUDIT_ACCOUNT_ID}" \
                    "log-archive-account-id=${LOG_ARCHIVE_ACCOUNT_ID}"; do
          if ! printf '%s' "${pair#*=}" | grep -qE '^[0-9]{12}$'; then
            echo "::error::${pair%%=*} '${pair#*=}' is not a 12-digit AWS account ID."
            exit 1
          fi
        done
        if [ "${AUDIT_ACCOUNT_ID}" = "${LOG_ARCHIVE_ACCOUNT_ID}" ] || [ "${AUDIT_ACCOUNT_ID}" = "${MANAGEMENT_ACCOUNT_ID}" ] || \
           [ "${LOG_ARCHIVE_ACCOUNT_ID}" = "${MANAGEMENT_ACCOUNT_ID}" ]; then
          echo "::error::management-account-id, audit-account-id and log-archive-account-id must differ."
          exit 1
        fi
        if ! printf '%s' "${ORGANIZATION_ID}" | grep -qE '^o-[0-9a-z]{10,32}$'; then
          echo "::error::organization-id '${ORGANIZATION_ID}' is not an AWS Organizations ID."
          exit 1
        fi
        if ! printf '%s' "${LANDING_ZONE_ARN}" | grep -qE '^arn:aws-eusc:controltower:[a-z0-9-]+:[0-9]{12}:landingzone/.+$'; then
          echo "::error::landing-zone-arn '${LANDING_ZONE_ARN}' is not an aws-eusc Control Tower Landing Zone ARN."
          exit 1
        fi
        if ! printf '%s\n' "${ACCOUNT_IDS}" | grep -qE '^[a-zA-Z0-9]+=[0-9]{12}$'; then
          echo "::error::account-ids carries no '<key>=<account id>' line."
          exit 1
        fi
        if ! printf '%s\n' "${OU_IDS}" | grep -qE '^[A-Za-z0-9/ -]+=ou-[0-9a-z]{4,32}-[0-9a-z]{8,32}$'; then
          echo "::error::ou-ids carries no '<ou path>=<ou id>' line."
          exit 1
        fi
        for number in "${JOB_STARTED_AT}" "${JOB_TIMEOUT_MINUTES}" "${SESSION_BUDGET_SECONDS}"; do
          if ! printf '%s' "${number}" | grep -qE '^[0-9]+$'; then
            echo "::error::'${number}' is not a whole number."
            exit 1
          fi
        done
        if [ "${SESSION_BUDGET_SECONDS}" -ge 3600 ]; then
          echo "::error::session-budget-seconds must stay below the one-hour credential lifetime."
          exit 1
        fi
        ACCOUNT_IDS_FILE="${RUNNER_TEMP}/account-baseline-account-ids"
        printf '%s\n' "${ACCOUNT_IDS}" > "${ACCOUNT_IDS_FILE}"
        OU_IDS_FILE="${RUNNER_TEMP}/account-baseline-ou-ids"
        printf '%s\n' "${OU_IDS}" > "${OU_IDS_FILE}"
        STATE_FILE="${RUNNER_TEMP}/account-baseline-run-ledger.json"
        rm -f "${STATE_FILE}"
        {
          echo "account-ids-file=${ACCOUNT_IDS_FILE}"
          echo "ou-ids-file=${OU_IDS_FILE}"
          echo "state-file=${STATE_FILE}"
          echo "report-file=${RUNNER_TEMP}/account-baseline-report.json"
          echo "job-deadline=$(( JOB_STARTED_AT + JOB_TIMEOUT_MINUTES * 60 ))"
        } >> "$GITHUB_OUTPUT"

    - name: Refresh OIDC credentials (account baseline preflight)
      uses: ccoe-aws/reusable-workflows/.github/actions/aws-credentials@main
      with:
        auth-method: oidc
        aws-partition: ${{ inputs.aws-partition }}
        aws-region: ${{ inputs.aws-region }}
        aws-account-id: ${{ inputs.management-account-id }}
        aws-role-name: ${{ inputs.deployment-role-name }}
        aws-session-name: lz-${{ inputs.environment }}-baseline-plan-${{ github.run_id }}

    - name: Account baseline preflight gate (read-only)
      id: plan
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment }}
        MANAGEMENT_ACCOUNT_ID: ${{ inputs.management-account-id }}
        ORGANIZATION_ID: ${{ inputs.organization-id }}
        LANDING_ZONE_ARN: ${{ inputs.landing-zone-arn }}
        AUDIT_ACCOUNT_ID: ${{ inputs.audit-account-id }}
        LOG_ARCHIVE_ACCOUNT_ID: ${{ inputs.log-archive-account-id }}
        ACCOUNT_IDS_FILE: ${{ steps.inputs.outputs.account-ids-file }}
        OU_IDS_FILE: ${{ steps.inputs.outputs.ou-ids-file }}
        STATE_FILE: ${{ steps.inputs.outputs.state-file }}
      run: |
        set -euo pipefail
        pnpm run reconcile:account-baseline -- --phase plan \
          --environment "${ENVIRONMENT_NAME}" \
          --management-account-id "${MANAGEMENT_ACCOUNT_ID}" \
          --organization-id "${ORGANIZATION_ID}" \
          --landing-zone-arn "${LANDING_ZONE_ARN}" \
          --audit-account-id "${AUDIT_ACCOUNT_ID}" \
          --log-archive-account-id "${LOG_ARCHIVE_ACCOUNT_ID}" \
          --account-ids-file "${ACCOUNT_IDS_FILE}" \
          --ou-ids-file "${OU_IDS_FILE}" \
          --state-file "${STATE_FILE}"

    # Up to three credential rounds of at most `session-budget-seconds` each. Every round repeats the
    # full preflight gate from live state before its first write. A round reports `complete`,
    # `continue` (credential budget used; the next round resumes from live state, where completed
    # controls read COMPLIANT) or `job-budget-exhausted`. A failure exits non-zero and stops the job.
    - name: Refresh OIDC credentials (account baseline round 1)
      uses: ccoe-aws/reusable-workflows/.github/actions/aws-credentials@main
      with:
        auth-method: oidc
        aws-partition: ${{ inputs.aws-partition }}
        aws-region: ${{ inputs.aws-region }}
        aws-account-id: ${{ inputs.management-account-id }}
        aws-role-name: ${{ inputs.deployment-role-name }}
        aws-session-name: lz-${{ inputs.environment }}-baseline-1-${{ github.run_id }}

    - name: Apply account baseline (round 1)
      id: round_1
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment }}
        MANAGEMENT_ACCOUNT_ID: ${{ inputs.management-account-id }}
        ORGANIZATION_ID: ${{ inputs.organization-id }}
        LANDING_ZONE_ARN: ${{ inputs.landing-zone-arn }}
        AUDIT_ACCOUNT_ID: ${{ inputs.audit-account-id }}
        LOG_ARCHIVE_ACCOUNT_ID: ${{ inputs.log-archive-account-id }}
        ACCOUNT_IDS_FILE: ${{ steps.inputs.outputs.account-ids-file }}
        OU_IDS_FILE: ${{ steps.inputs.outputs.ou-ids-file }}
        STATE_FILE: ${{ steps.inputs.outputs.state-file }}
        JOB_DEADLINE: ${{ steps.inputs.outputs.job-deadline }}
        SESSION_BUDGET_SECONDS: ${{ inputs.session-budget-seconds }}
      run: |
        set -euo pipefail
        pnpm run reconcile:account-baseline -- --phase apply \
          --environment "${ENVIRONMENT_NAME}" \
          --management-account-id "${MANAGEMENT_ACCOUNT_ID}" \
          --organization-id "${ORGANIZATION_ID}" \
          --landing-zone-arn "${LANDING_ZONE_ARN}" \
          --audit-account-id "${AUDIT_ACCOUNT_ID}" \
          --log-archive-account-id "${LOG_ARCHIVE_ACCOUNT_ID}" \
          --account-ids-file "${ACCOUNT_IDS_FILE}" \
          --ou-ids-file "${OU_IDS_FILE}" \
          --state-file "${STATE_FILE}" \
          --session-budget-seconds "${SESSION_BUDGET_SECONDS}" \
          --job-deadline-epoch "${JOB_DEADLINE}"

    - name: Refresh OIDC credentials (account baseline round 2)
      if: ${{ steps.round_1.outputs.status == 'continue' }}
      uses: ccoe-aws/reusable-workflows/.github/actions/aws-credentials@main
      with:
        auth-method: oidc
        aws-partition: ${{ inputs.aws-partition }}
        aws-region: ${{ inputs.aws-region }}
        aws-account-id: ${{ inputs.management-account-id }}
        aws-role-name: ${{ inputs.deployment-role-name }}
        aws-session-name: lz-${{ inputs.environment }}-baseline-2-${{ github.run_id }}

    - name: Apply account baseline (round 2)
      id: round_2
      if: ${{ steps.round_1.outputs.status == 'continue' }}
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment }}
        MANAGEMENT_ACCOUNT_ID: ${{ inputs.management-account-id }}
        ORGANIZATION_ID: ${{ inputs.organization-id }}
        LANDING_ZONE_ARN: ${{ inputs.landing-zone-arn }}
        AUDIT_ACCOUNT_ID: ${{ inputs.audit-account-id }}
        LOG_ARCHIVE_ACCOUNT_ID: ${{ inputs.log-archive-account-id }}
        ACCOUNT_IDS_FILE: ${{ steps.inputs.outputs.account-ids-file }}
        OU_IDS_FILE: ${{ steps.inputs.outputs.ou-ids-file }}
        STATE_FILE: ${{ steps.inputs.outputs.state-file }}
        JOB_DEADLINE: ${{ steps.inputs.outputs.job-deadline }}
        SESSION_BUDGET_SECONDS: ${{ inputs.session-budget-seconds }}
      run: |
        set -euo pipefail
        pnpm run reconcile:account-baseline -- --phase apply \
          --environment "${ENVIRONMENT_NAME}" \
          --management-account-id "${MANAGEMENT_ACCOUNT_ID}" \
          --organization-id "${ORGANIZATION_ID}" \
          --landing-zone-arn "${LANDING_ZONE_ARN}" \
          --audit-account-id "${AUDIT_ACCOUNT_ID}" \
          --log-archive-account-id "${LOG_ARCHIVE_ACCOUNT_ID}" \
          --account-ids-file "${ACCOUNT_IDS_FILE}" \
          --ou-ids-file "${OU_IDS_FILE}" \
          --state-file "${STATE_FILE}" \
          --session-budget-seconds "${SESSION_BUDGET_SECONDS}" \
          --job-deadline-epoch "${JOB_DEADLINE}"

    - name: Refresh OIDC credentials (account baseline round 3)
      if: ${{ steps.round_2.outputs.status == 'continue' }}
      uses: ccoe-aws/reusable-workflows/.github/actions/aws-credentials@main
      with:
        auth-method: oidc
        aws-partition: ${{ inputs.aws-partition }}
        aws-region: ${{ inputs.aws-region }}
        aws-account-id: ${{ inputs.management-account-id }}
        aws-role-name: ${{ inputs.deployment-role-name }}
        aws-session-name: lz-${{ inputs.environment }}-baseline-3-${{ github.run_id }}

    - name: Apply account baseline (round 3)
      id: round_3
      if: ${{ steps.round_2.outputs.status == 'continue' }}
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment }}
        MANAGEMENT_ACCOUNT_ID: ${{ inputs.management-account-id }}
        ORGANIZATION_ID: ${{ inputs.organization-id }}
        LANDING_ZONE_ARN: ${{ inputs.landing-zone-arn }}
        AUDIT_ACCOUNT_ID: ${{ inputs.audit-account-id }}
        LOG_ARCHIVE_ACCOUNT_ID: ${{ inputs.log-archive-account-id }}
        ACCOUNT_IDS_FILE: ${{ steps.inputs.outputs.account-ids-file }}
        OU_IDS_FILE: ${{ steps.inputs.outputs.ou-ids-file }}
        STATE_FILE: ${{ steps.inputs.outputs.state-file }}
        JOB_DEADLINE: ${{ steps.inputs.outputs.job-deadline }}
        SESSION_BUDGET_SECONDS: ${{ inputs.session-budget-seconds }}
      run: |
        set -euo pipefail
        pnpm run reconcile:account-baseline -- --phase apply \
          --environment "${ENVIRONMENT_NAME}" \
          --management-account-id "${MANAGEMENT_ACCOUNT_ID}" \
          --organization-id "${ORGANIZATION_ID}" \
          --landing-zone-arn "${LANDING_ZONE_ARN}" \
          --audit-account-id "${AUDIT_ACCOUNT_ID}" \
          --log-archive-account-id "${LOG_ARCHIVE_ACCOUNT_ID}" \
          --account-ids-file "${ACCOUNT_IDS_FILE}" \
          --ou-ids-file "${OU_IDS_FILE}" \
          --state-file "${STATE_FILE}" \
          --session-budget-seconds "${SESSION_BUDGET_SECONDS}" \
          --job-deadline-epoch "${JOB_DEADLINE}"

    - name: Check that the account baseline finished within the job budget
      id: rounds
      shell: bash
      env:
        STATUSES: >-
          ${{ steps.round_1.outputs.status }} ${{ steps.round_2.outputs.status }} ${{ steps.round_3.outputs.status }}
      run: |
        set -euo pipefail
        LAST=$(printf '%s\n' ${STATUSES} | tail -n 1)
        case "${LAST}" in
          complete)
            echo "Account baseline apply rounds completed." ;;
          continue)
            echo "::error::The account baseline did not finish within three credential rounds. Re-run the workflow; completed controls are recognized as COMPLIANT."
            exit 1 ;;
          job-budget-exhausted)
            echo "::error::Not enough job time was left for the next account baseline write and its settle polling. Re-run the workflow; completed controls are recognized as COMPLIANT."
            exit 1 ;;
          *)
            echo "::error::Unexpected account baseline round status '${LAST}'."
            exit 1 ;;
        esac

    # The verification is read-only and runs even after an earlier failure of this action, so the
    # partial state is always reported. It can never make a failed job succeed: an earlier failed
    # step has already failed the job, and the verification itself exits non-zero unless the
    # environment is accepted.
    - name: Refresh OIDC credentials (account baseline verification)
      if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
      uses: ccoe-aws/reusable-workflows/.github/actions/aws-credentials@main
      with:
        auth-method: oidc
        aws-partition: ${{ inputs.aws-partition }}
        aws-region: ${{ inputs.aws-region }}
        aws-account-id: ${{ inputs.management-account-id }}
        aws-role-name: ${{ inputs.deployment-role-name }}
        aws-session-name: lz-${{ inputs.environment }}-baseline-verify-${{ github.run_id }}

    - name: Account baseline verification and acceptance gate (read-only)
      id: verify
      if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment }}
        MANAGEMENT_ACCOUNT_ID: ${{ inputs.management-account-id }}
        ORGANIZATION_ID: ${{ inputs.organization-id }}
        LANDING_ZONE_ARN: ${{ inputs.landing-zone-arn }}
        AUDIT_ACCOUNT_ID: ${{ inputs.audit-account-id }}
        LOG_ARCHIVE_ACCOUNT_ID: ${{ inputs.log-archive-account-id }}
        ACCOUNT_IDS_FILE: ${{ steps.inputs.outputs.account-ids-file }}
        OU_IDS_FILE: ${{ steps.inputs.outputs.ou-ids-file }}
        STATE_FILE: ${{ steps.inputs.outputs.state-file }}
        REPORT_FILE: ${{ steps.inputs.outputs.report-file }}
      run: |
        set -euo pipefail
        pnpm run reconcile:account-baseline -- --phase verify \
          --environment "${ENVIRONMENT_NAME}" \
          --management-account-id "${MANAGEMENT_ACCOUNT_ID}" \
          --organization-id "${ORGANIZATION_ID}" \
          --landing-zone-arn "${LANDING_ZONE_ARN}" \
          --audit-account-id "${AUDIT_ACCOUNT_ID}" \
          --log-archive-account-id "${LOG_ARCHIVE_ACCOUNT_ID}" \
          --account-ids-file "${ACCOUNT_IDS_FILE}" \
          --ou-ids-file "${OU_IDS_FILE}" \
          --state-file "${STATE_FILE}" \
          --report-file "${REPORT_FILE}"

    - name: Upload account-baseline-report.json
      if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: account-baseline-report-${{ inputs.environment }}
        path: ${{ steps.inputs.outputs.report-file }}
        if-no-files-found: error
        retention-days: 90
