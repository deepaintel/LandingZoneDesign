# ---------------------------------------------------------------------------------------------
# Staging AWS Organization - deployment configuration.
#
# Deployment source: protected release/* branch via .github/workflows/deploy.yml.
#
# Loading: this file is loaded via @ccoe-aws_if-it/ccoe-config-reader used as a generic YAML
# loader library by ConfigReader with LandingZoneSchema.
#
# The AWS Organizations Root is NEVER created by CDK application code. Its lifecycle is handled
# by the prepare-organization composite action (.github/actions/prepare-organization) at deploy
# time: idempotent detect-or-create, Root ID emitted as a step output and fed to `cdk deploy`
# via the OrganizationRootId CloudFormation parameter. No Root ID is stored in this file or
# anywhere else in source control.
#
# aws.accountId is the AWS Organizations management account ID (a 12-digit identifier, not a
# credential). It may live here under the compensating controls documented in CLAUDE.md §14.
# No access keys, secret access keys, IAM user credentials, bearer tokens, or role ARNs are
# stored in this file.
# ---------------------------------------------------------------------------------------------
aws:
  # Staging AWS Organizations management account (aws-cloud-org-002).
  accountId: '118669550429'

identityCenter:
  instanceName: aws-esc-landing-zone-staging
  scim:
    checkForScimSync: 172800 # 48 hours
  scimCleanup:
    checkForScimCleanup: 172800 # 48 hours

# Shared-account per-environment overrides. Names / OU / owner / costCentre / operationsContact
# come from config/default.yaml. Only email and securityContact differ between environments; both
# are declared here so a merge conflict inside default.yaml can never silently supply the wrong
# staging email. Emails are unique AWS account identifiers - CreateAccount rejects duplicates.
accounts:
  logArchive:
    email: 'FMITaws-cloud-org-002+LogArchive@if.se'
    securityContact: 'FMITaws-cloud-org-002+SecurityContact@if.se'
  audit:
    email: 'FMITaws-cloud-org-002+Audit@if.se'
    securityContact: 'FMITaws-cloud-org-002+SecurityContact@if.se'

# ---------------------------------------------------------------------------------------------
# Remaining Landing Zone accounts for Staging (8 member accounts; Audit and Log Archive are
# provisioned separately by the shared-accounts stack above).
#
# Governed by `.apm/skills/generate-account/SKILL.md`. Loaded by `scripts/provision-landing-zone-accounts.ts`
# (run by the `deploy-landing-zone-accounts` action) via `@ccoe-aws_if-it/ccoe-config-reader` +
# the `landingZoneAccountsSchema` block of `LandingZoneSchema`.
#
# - sharedServices / network: environment-specific values only. Name, OU, owner, costCentre,
#   operationsContact, dataResidency, and domain come from config/default.yaml.
# - The six CCoE Verification accounts exist in Staging ONLY, so they are declared here in full
#   and never in config/default.yaml or config/production.yaml.
#
# Customer-confirmed P1 values: SharedServices, Network, and Workloads/*/Prod use
# `environment: prod`; Workloads/*/Non-Prod use `environment: staging`; all eight use
# `lifecycle: active` and `dataClassification: internal`. The P1 `environment` value is an
# account/tag classification and does not select the AWS Organization.
#
# Authoritative mappings: Owner / Team -> owner, Account Email -> owner-email,
# Cost Centre -> itsystemcode. They are derived at synth time and are not separate inputs.
# ---------------------------------------------------------------------------------------------
landingZoneAccounts:
  sharedServices:
    email: 'FMITaws-cloud-org-002+SharedServices@if.se'
    securityContact: 'FMITaws-cloud-org-002+SecurityContact@if.se'
    tags:
      environment: prod
      lifecycle: active
      dataClassification: internal
  network:
    email: 'FMITaws-cloud-org-002+Network@if.se'
